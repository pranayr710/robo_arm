<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robotic Arm — Live Control</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#141a22; --panel2:#0f151c; --line:#242e3a;
    --txt:#e6edf3; --muted:#8b98a5; --accent:#5b9bf0; --ok:#3fb950;
    --danger:#e5484d; --amber:#e3b341;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#16202b,var(--bg));
       color:var(--txt);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
  .badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .badge.ok{color:var(--accent);border-color:var(--accent)}
  .badge.live{color:var(--ok);border-color:var(--ok)}
  .badge.off{color:var(--muted)}
  .tabs{display:flex;gap:8px;margin-left:auto}
  .tab{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#111823;
       color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}
  .tab:hover{border-color:var(--accent);color:var(--txt)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#06101f}
  .wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;padding:18px;max-width:1120px}
  @media(max-width:900px){.wrap{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
        border-radius:14px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:0 0 12px}
  canvas#stage{width:100%;height:auto;display:block;border-radius:10px;background:#0a0e13}
  #camwrap{display:none;position:relative;margin-bottom:16px}
  #camwrap.show{display:block}
  #camwrap video,#camwrap canvas{width:100%;border-radius:10px;transform:scaleX(-1)}
  #camwrap canvas{position:absolute;inset:0}
  #blink{position:absolute;top:8px;left:10px;background:rgba(0,0,0,.55);color:var(--accent);
         padding:3px 8px;border-radius:7px;font-size:12px;font-variant-numeric:tabular-nums}
  .srow{display:flex;justify-content:space-between;margin:12px 0 4px;color:var(--muted)}
  .srow b{color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .panel{display:none}.panel.show{display:block}
  #pad{position:relative;height:180px;border-radius:12px;border:1px dashed var(--line);
       background:repeating-linear-gradient(0deg,#0e141c,#0e141c 19px,#121a24 20px),
                  repeating-linear-gradient(90deg,#0e141c,#0e141c 19px,#121a24 20px);
       cursor:crosshair;touch-action:none}
  #paddot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
          background:var(--accent);box-shadow:0 0 16px var(--accent);left:50%;top:50%}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .btns{display:flex;gap:10px;margin-top:16px}
  button.act{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#1a2330;
             color:var(--txt);font-weight:700;cursor:pointer}
  button.act:hover{border-color:var(--accent)}
  button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
  .writebox{display:flex;gap:8px;margin-top:10px}
  .writebox input{flex:2;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0a0e13;color:var(--txt)}
  .transcript{margin-top:14px;padding:12px;border-radius:10px;background:#0a0e13;border:1px solid var(--line)}
  .transcript .big{font-size:26px;font-weight:800;letter-spacing:2px;min-height:32px}
  .transcript .pend{color:var(--amber);font-family:ui-monospace,monospace;font-size:18px;letter-spacing:4px}
  .log{margin-top:14px;font-size:12px;color:var(--muted);min-height:18px}
</style>
</head>
<body>
<header>
  <h1>🤖 Robotic Arm — Live Control</h1>
  <span id="conn" class="badge off">offline</span>
  <div class="tabs">
    <div class="tab" data-mode="manual">Manual</div>
    <div class="tab" data-mode="trackpad">Trackpad</div>
    <div class="tab" data-mode="hand">Hand-Follow</div>
    <div class="tab" data-mode="morse">Blink-Morse</div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Arm &amp; paper</h2>
    <div id="camwrap">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <span id="blink">blink —</span>
    </div>
    <canvas id="stage" width="520" height="400"></canvas>
  </div>

  <div class="card">
    <h2>Controls</h2>

    <div class="panel show" data-for="manual" id="sliders"></div>

    <div class="panel" data-for="trackpad">
      <div id="pad"><div id="paddot"></div></div>
      <div class="hint">Drag anywhere on the pad — X = base rotation, Y = shoulder reach.</div>
    </div>

    <div class="btns">
      <button class="act" id="home">Home</button>
      <button class="act" id="release">Release</button>
      <button class="act danger" id="estop">■ STOP</button>
    </div>

    <div style="margin-top:18px">
      <h2>Write a message (Morse)</h2>
      <div class="writebox">
        <input id="wtext" type="text" value="SOS" maxlength="24" />
        <button class="act" id="wbtn">Write ✍</button>
      </div>
      <div class="transcript">
        <div class="pend" id="pending">·</div>
        <div class="big" id="transcript">—</div>
      </div>
      <div class="btns"><button class="act" id="clearmorse">Clear message</button></div>
    </div>

    <div class="log" id="log">ready.</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
