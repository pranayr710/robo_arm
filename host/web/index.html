<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robotic Arm — Control</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171c24; --line:#2a323d; --txt:#e6edf3;
    --muted:#8b98a5; --accent:#4aa8ff; --ok:#3fb950; --danger:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;
         border-bottom:1px solid var(--line)}
  header h1{font-size:16px;margin:0;font-weight:600}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .badge.live{color:var(--ok);border-color:var(--ok)}
  .badge.mock{color:var(--accent);border-color:var(--accent)}
  .badge.off{color:var(--muted)}
  .wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;max-width:980px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  canvas{width:100%;height:auto;display:block;border-radius:8px;background:#0b0e13}
  .row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px}
  .row label{color:var(--muted)}
  .row .val{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .btns{display:flex;gap:10px;margin-top:18px}
  button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);
          background:#202834;color:var(--txt);font-weight:600;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.estop{background:var(--danger);border-color:var(--danger);color:#fff}
  button.release{background:transparent}
  .estop-banner{display:none;margin-top:12px;padding:8px 12px;border-radius:8px;
     background:rgba(248,81,73,.12);color:var(--danger);border:1px solid var(--danger);
     font-weight:600;text-align:center}
  .estop-banner.on{display:block}
  .telemetry{font-size:12px;color:var(--muted);margin-top:14px;
     font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <h1>🤖 Robotic Arm — Control &amp; Visualization</h1>
  <span id="conn" class="badge off">connecting…</span>
</header>

<div class="wrap">
  <div class="card">
    <canvas id="view" width="560" height="420"></canvas>
    <div class="telemetry" id="tel">live angles —</div>
  </div>

  <div class="card">
    <div id="sliders"></div>
    <div class="btns">
      <button id="home">Home</button>
      <button id="release" class="release">Release</button>
    </div>
    <div class="btns">
      <button id="estop" class="estop">■ EMERGENCY STOP</button>
    </div>
    <div id="banner" class="estop-banner">⚠ EMERGENCY STOP ACTIVE — press Release</div>

    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <div class="row"><label>Mode</label><span class="val" id="modeval">manual</span></div>
    <div class="btns">
      <button id="m-manual">Manual</button>
      <button id="m-hand">Hand-follow</button>
      <button id="m-joy">Joystick</button>
    </div>

    <div class="row" style="margin-top:16px"><label>Write message (Morse)</label></div>
    <div class="btns">
      <input id="wtext" type="text" value="SOS" maxlength="40"
             style="flex:2;padding:9px;border-radius:9px;border:1px solid var(--line);background:#0b0e13;color:var(--txt)">
      <button id="wbtn" style="flex:1">Write ✍</button>
    </div>
    <div class="telemetry" id="tel2">obstacle: — cm</div>
  </div>
</div>

<script>
const SERVOS = [
  {name:"Base",     ch:0, min:0, max:180, init:90},
  {name:"Gripper",  ch:1, min:0, max:180, init:60},
  {name:"Shoulder", ch:2, min:0, max:180, init:90},
  {name:"Elbow",    ch:3, min:0, max:180, init:90},
];

// ---- build sliders ----------------------------------------------------
const slidersEl = document.getElementById("sliders");
const sliders = [];
SERVOS.forEach(s => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<label>${s.name}</label><span class="val" id="v${s.ch}">${s.init}°</span>`;
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = s.min; inp.max = s.max; inp.value = s.init;
  inp.oninput = () => {
    document.getElementById("v"+s.ch).textContent = inp.value + "°";
    send({cmd:"S", ch:s.ch, angle:+inp.value});
  };
  slidersEl.appendChild(row); slidersEl.appendChild(inp);
  sliders[s.ch] = inp;
});

// ---- websocket --------------------------------------------------------
let ws, live = {angles:[90,60,90,90], estop:0};
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen  = () => setConn(true, false);
  ws.onclose = () => { setConn(false); setTimeout(connect, 1000); };
  ws.onmessage = e => {
    live = JSON.parse(e.data);
    setConn(true, live.mock);
    document.getElementById("banner").classList.toggle("on", !!live.estop);
    document.getElementById("tel").textContent =
      "live angles — base " + live.angles[0] + "°  grip " + live.angles[1] +
      "°  shoulder " + live.angles[2] + "°  elbow " + live.angles[3] + "°";
    const m = live.joystick ? "joystick" : (live.mode || "manual");
    document.getElementById("modeval").textContent = m;
    const d = live.dist;
    document.getElementById("tel2").textContent =
      "obstacle: " + (d >= 999 ? "— (no sensor)" : d + " cm");
    // sliders only make sense in manual mode
    const manual = (m === "manual");
    SERVOS.forEach(s => sliders[s.ch].disabled = !manual);
  };
}
function send(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }
function setConn(ok, mock){
  const b = document.getElementById("conn");
  if(!ok){ b.className="badge off"; b.textContent="disconnected"; }
  else if(mock){ b.className="badge mock"; b.textContent="MOCK (no hardware)"; }
  else { b.className="badge live"; b.textContent="LIVE"; }
}
document.getElementById("home").onclick    = () => {
  send({cmd:"H"});
  SERVOS.forEach(s => { sliders[s.ch].value=s.init; document.getElementById("v"+s.ch).textContent=s.init+"°"; });
};
document.getElementById("estop").onclick   = () => send({cmd:"E"});
document.getElementById("release").onclick = () => send({cmd:"R"});

document.getElementById("m-manual").onclick = () => { send({cmd:"J",on:false}); send({cmd:"MODE",mode:"manual"}); };
document.getElementById("m-hand").onclick   = () => { send({cmd:"J",on:false}); send({cmd:"MODE",mode:"hand"}); };
document.getElementById("m-joy").onclick    = () => { send({cmd:"MODE",mode:"manual"}); send({cmd:"J",on:true}); };
document.getElementById("wbtn").onclick     = () => send({cmd:"WRITE",text:document.getElementById("wtext").value});
connect();

// ---- 2D visualization (side view + base dial) -------------------------
const cv = document.getElementById("view"), ctx = cv.getContext("2d");
const D = Math.PI/180;
function draw(){
  const [base, grip, shoulder, elbow] = live.angles;
  ctx.clearRect(0,0,cv.width,cv.height);

  // ground + pedestal
  const px = 200, py = 330, L1 = 110, L2 = 90;
  ctx.strokeStyle="#2a323d"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(40,py+22); ctx.lineTo(cv.width-40,py+22); ctx.stroke();
  ctx.fillStyle="#202834"; ctx.fillRect(px-26,py,52,22);

  // link 1 (shoulder) — angle from +x, y-up
  const a1 = shoulder*D;
  const ex = px + L1*Math.cos(a1), ey = py - L1*Math.sin(a1);
  // link 2 (elbow) continues from link 1
  const a2 = a1 + (elbow-90)*D;
  const wx = ex + L2*Math.cos(a2), wy = ey - L2*Math.sin(a2);

  const seg = (x1,y1,x2,y2,c) => { ctx.strokeStyle=c; ctx.lineWidth=9; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); };
  const joint = (x,y) => { ctx.fillStyle="#e6edf3"; ctx.beginPath(); ctx.arc(x,y,6,0,7); ctx.fill(); };

  seg(px,py,ex,ey,"#4aa8ff");
  seg(ex,ey,wx,wy,"#7cc4ff");
  joint(px,py); joint(ex,ey);

  // gripper claw at wrist — opening from gripper angle (30 closed .. 160 open)
  const open = Math.max(0, Math.min(1,(grip-30)/130));
  const spread = (6 + open*22);
  const gdir = a2, perp = gdir + Math.PI/2;
  for(const s of [1,-1]){
    const bx = wx + Math.cos(perp)*spread*s, by = wy - Math.sin(perp)*spread*s;
    const tx = bx + Math.cos(gdir)*26,       ty = by - Math.sin(gdir)*26;
    seg(wx,wy,bx,by,"#9aa7b4"); seg(bx,by,tx,ty,"#9aa7b4");
  }

  // base rotation dial (top-view), top-right
  const cx=470, cy=90, r=42;
  ctx.strokeStyle="#2a323d"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.stroke();
  const ba=(base-90)*D; // 90° = pointing up
  ctx.strokeStyle="#4aa8ff"; ctx.lineWidth=4; ctx.beginPath();
  ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.sin(ba)*r, cy-Math.cos(ba)*r); ctx.stroke();
  ctx.fillStyle="#8b98a5"; ctx.font="11px system-ui"; ctx.textAlign="center";
  ctx.fillText("base "+base+"°", cx, cy+r+16);

  if(live.estop){ ctx.fillStyle="rgba(248,81,73,.9)"; ctx.font="bold 16px system-ui";
    ctx.textAlign="left"; ctx.fillText("● E-STOP", 20, 30); }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
